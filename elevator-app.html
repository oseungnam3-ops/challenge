<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c2340">
<title>🛗 승강기 관리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --navy:#0c2340; --navy2:#16355e; --gold:#c9a962; --gold-d:#a88a43; --bg:#f2f4f8; --card:#fff;
  --text:#1b2433; --muted:#6b7686; --line:#e3e7ee; --danger:#d93636; --warn:#e08a00;
  --repair:#2f6fdd; --replace:#f08a1c; --install:#2e9e5b; --inspect:#7a4fd1; --insure:#d93636; --etc:#7b8494;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.app{max-width:960px;margin:0 auto;min-height:100vh;padding-bottom:40px}

/* header */
header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:16px 16px 0;border-radius:0 0 24px 24px;position:sticky;top:0;z-index:20;box-shadow:0 4px 16px rgba(12,35,64,.25)}
.hd-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{font-size:19px;font-weight:800;letter-spacing:-.3px}
.logo span{color:var(--gold)}
.today-label{font-size:13px;color:var(--gold);font-weight:600;text-align:right}
.main-tabs{display:flex;gap:6px;margin-top:12px}
.main-tab{flex:1;padding:11px 0 12px;color:rgba(255,255,255,.65);font-weight:700;font-size:15px;border-bottom:3px solid transparent}
.main-tab.on{color:#fff;border-bottom-color:var(--gold)}

main{padding:16px}
.card{background:var(--card);border-radius:18px;box-shadow:0 2px 10px rgba(12,35,64,.07);padding:16px}
.hidden{display:none!important}

/* buttons */
.btn{padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;background:var(--navy);color:#fff}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn.ghost{background:#eef1f6;color:var(--navy)}
.btn.danger{background:#fdeaea;color:var(--danger)}
.btn.block{width:100%;padding:14px;font-size:15px}
.btn:active{transform:scale(.98)}

/* toolbar */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.seg{display:flex;background:#e6eaf1;border-radius:14px;padding:3px;flex:1;min-width:230px}
.seg button{flex:1;padding:9px 4px;border-radius:11px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--navy);color:#fff}
.nav{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.nav .title{flex:1;text-align:center;font-weight:800;font-size:17px;color:var(--navy)}
.nav button{width:38px;height:38px;border-radius:12px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.08);font-size:18px;color:var(--navy);font-weight:800}
.nav .today-btn{width:auto;padding:0 14px;font-size:13px;background:var(--gold);color:var(--navy)}

/* month */
.month-head,.month-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.month-head div{text-align:center;font-size:12px;font-weight:700;color:var(--muted);padding:4px 0 8px}
.month-head div:first-child,.day-cell.sun .num{color:var(--danger)}
.month-head div:last-child,.day-cell.sat .num{color:var(--repair)}
.day-cell{min-height:62px;border-top:1px solid var(--line);padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:0;background:none}
.day-cell.other{opacity:.35}
.day-cell .num{width:26px;height:26px;line-height:26px;border-radius:50%;text-align:center;font-size:13px;font-weight:700}
.day-cell.today .num{background:var(--navy);color:#fff}
.day-cell.sel{background:#fbf6e8}
.day-cell.sel .num{outline:2px solid var(--gold)}
.cnt{font-size:11px;font-weight:700;background:var(--gold);color:var(--navy);border-radius:9px;padding:0 6px}
.dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
.dot{width:6px;height:6px;border-radius:50%}

/* timeline */
.tl-wrap{overflow-x:auto}
.tl{position:relative;display:grid}
.tl-hours{position:relative}
.tl-hour{position:absolute;left:0;right:0;font-size:11px;color:var(--muted);padding-left:2px;transform:translateY(-7px)}
.tl-col{position:relative;border-left:1px solid var(--line)}
.tl-line{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.tl-head{display:grid;position:sticky;top:0}
.tl-head div{text-align:center;font-size:12px;font-weight:700;padding:6px 0;color:var(--muted)}
.tl-head div.today{color:var(--navy)}
.tl-head div.today b{background:var(--navy);color:#fff;border-radius:10px;padding:1px 7px}
.tl-head div b{font-size:14px}
.ev{position:absolute;border-radius:8px;padding:3px 5px;color:#fff;font-size:11px;line-height:1.25;overflow:hidden;text-align:left;border-left:4px solid rgba(0,0,0,.25);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.ev b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.day-ev{font-size:13px;padding:6px 10px}
.ev.day-ev b{font-size:14px}
.nowline{position:absolute;left:0;right:0;border-top:2px solid var(--danger);z-index:3;pointer-events:none}

/* list */
.sec-title{font-weight:800;color:var(--navy);margin:18px 2px 8px;font-size:15px}
.list-date{font-size:13px;font-weight:700;color:var(--muted);margin:10px 2px 6px}
.item{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:#fff;border-radius:14px;padding:12px;margin-bottom:8px;box-shadow:0 1px 6px rgba(12,35,64,.06);border-left:6px solid var(--etc)}
.item .tm{font-size:12px;font-weight:700;color:var(--muted);min-width:46px}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .tx small{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:28px 8px}

/* companies */
.search{width:100%;padding:13px 16px;border-radius:14px;border:1.5px solid var(--line);background:#fff;margin-bottom:12px;outline:none}
.search:focus,.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--gold)}
.co{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(12,35,64,.07);border-top:4px solid var(--gold)}
.co h3{color:var(--navy);font-size:17px;margin-bottom:4px}
.co .row{font-size:14px;color:#3a4558;margin:2px 0;word-break:break-all}
.co .dates{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.dbox{background:#f6f8fb;border-radius:12px;padding:8px 10px;font-size:13px}
.dbox small{display:block;color:var(--muted);font-size:11px}
.dbox.w{background:#fff4e0}.dbox.u{background:#fdeaea}
.dbox .badge{font-weight:800}
.co .acts{display:flex;gap:8px;margin-top:8px}
.co .acts .btn{flex:1}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(8,20,40,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
@media(min-width:600px){.overlay{align-items:center}.modal{border-radius:24px}}
.modal h2{color:var(--navy);font-size:19px;margin-bottom:14px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:13px;font-weight:700;color:var(--navy);margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;outline:none}
.fld textarea{min-height:80px;resize:vertical}
.fld2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--danger);font-size:13px;margin-bottom:8px;min-height:0}
.m-acts{display:flex;gap:8px;margin-top:6px}
.m-acts .btn{flex:1;padding:13px}
.detail-row{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.detail-row span:first-child{min-width:64px;color:var(--muted);font-weight:700}
.tag{display:inline-block;color:#fff;border-radius:10px;padding:2px 10px;font-size:12px;font-weight:700}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:14px;z-index:99;font-size:14px;box-shadow:0 4px 16px rgba(0,0,0,.3)}
@media(max-width:480px){.day-cell{min-height:54px}main{padding:12px}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="hd-top">
      <div class="logo">🛗 승강기 <span>관리</span></div>
      <div class="today-label" id="todayLabel"></div>
    </div>
    <div class="main-tabs">
      <button class="main-tab on" data-tab="sched">📋 일정표</button>
      <button class="main-tab" data-tab="comp">🏢 업체 관리</button>
    </div>
  </header>

  <main>
    <section id="tab-sched">
      <div class="toolbar">
        <div class="seg" id="viewSeg">
          <button data-v="month" class="on">📅 월별</button>
          <button data-v="week">📊 주별</button>
          <button data-v="day">📋 일별</button>
        </div>
      </div>
      <div class="nav">
        <button id="prevBtn" aria-label="이전">‹</button>
        <div class="title" id="navTitle"></div>
        <button id="nextBtn" aria-label="다음">›</button>
        <button class="today-btn" id="todayBtn">오늘</button>
      </div>
      <div class="card" id="calArea"></div>
      <div class="sec-title" id="listTitle">일정 목록</div>
      <div id="schedList"></div>
      <button class="btn gold block" id="addSchedBtn">+ 일정 추가</button>
    </section>

    <section id="tab-comp" class="hidden">
      <input class="search" id="search" type="search" placeholder="🔍 업체명 또는 주소로 검색">
      <div id="coList"></div>
      <button class="btn gold block" id="addCoBtn">+ 업체 추가</button>
    </section>
  </main>
</div>
<div id="modalRoot"></div>

<script>
'use strict';
/* ===== 상수 ===== */
const KEY_C='elevatorApp_companies', KEY_S='elevatorApp_schedules';
const TYPES={
  repair:{l:'수리',i:'🔧',c:'#2f6fdd'},
  replace:{l:'교체',i:'🔄',c:'#f08a1c'},
  install:{l:'설치',i:'🏗️',c:'#2e9e5b'},
  inspect:{l:'검사',i:'📋',c:'#7a4fd1'},
  insure:{l:'보험',i:'🛡️',c:'#d93636'},
  etc:{l:'기타',i:'📝',c:'#7b8494'}
};
const DOW=['일','월','화','수','목','금','토'];
const AUTO={
  insp:{type:'inspect',base:'inspectionDate',rules:[[30,'검사 준비'],[7,'검사 임박'],[0,'정기 검사']]},
  ins:{type:'insure',base:'insuranceDate',rules:[[30,'보험 갱신 준비'],[7,'보험 만기 임박'],[0,'보험 만기']]}
};

/* ===== 유틸 ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);return x};
const todayStr=()=>fmt(new Date());
const toMin=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};
const toTime=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const daysUntil=s=>Math.round((parse(s)-parse(todayStr()))/86400000);
const dateKo=s=>{const d=parse(s);return `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()} (${DOW[d.getDay()]})`};

function load(k){try{const v=JSON.parse(localStorage.getItem(k));return Array.isArray(v)?v:[]}catch(e){return []}}
function persist(){
  try{localStorage.setItem(KEY_C,JSON.stringify(companies));localStorage.setItem(KEY_S,JSON.stringify(schedules))}
  catch(e){toast('⚠️ 저장 실패: 브라우저 저장소를 확인하세요')}
}
function toast(msg){
  const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);
  setTimeout(()=>t.remove(),2200);
}

/* ===== 상태 ===== */
let companies=load(KEY_C), schedules=load(KEY_S);
let view='month', cur=todayStr(), tab='sched', query='';

const coName=id=>{const c=companies.find(x=>x.id===id);return c?c.name:'(삭제된 업체)'};
const endOf=s=>s.end&&toMin(s.end)>toMin(s.start)?toMin(s.end):toMin(s.start)+60;
const byTime=(a,b)=>a.date.localeCompare(b.date)||a.start.localeCompare(b.start);
const eventsOn=d=>schedules.filter(s=>s.date===d).sort(byTime);

/* ===== 자동 일정 ===== */
function syncAutoSchedules(co){
  const today=todayStr();
  let added=0;
  Object.keys(AUTO).forEach(kind=>{
    const cfg=AUTO[kind], base=co[cfg.base];
    // 기준일이 바뀌어 더 이상 맞지 않는 자동 일정 제거
    schedules=schedules.filter(s=>!(s.auto&&s.companyId===co.id&&s.auto.startsWith(kind+':')&&!s.auto.endsWith(':'+base)));
    if(!base)return;
    cfg.rules.forEach(([off,title])=>{
      const date=fmt(addDays(parse(base),-off));
      if(date<today)return; // 이미 지난 날짜는 생성하지 않음
      const key=`${kind}:${off}:${base}`;
      if(schedules.some(s=>s.companyId===co.id&&s.auto===key))return; // 중복 방지
      schedules.push({id:uid(),date,start:'09:00',end:'10:00',companyId:co.id,type:cfg.type,title,memo:'자동 생성 일정',auto:key});
      added++;
    });
  });
  return added;
}

/* ===== 경고 ===== */
function warnInfo(dateStr){
  if(!dateStr)return {cls:'',txt:'-'};
  const d=daysUntil(dateStr);
  const label=dateKo(dateStr);
  if(d<0)return {cls:'',txt:`${label} <small>(${-d}일 지남)</small>`};
  if(d<=7)return {cls:'u',txt:`<span class="badge">🔴 ${label}</span> <small>${d===0?'오늘':'D-'+d}</small>`};
  if(d<=30)return {cls:'w',txt:`<span class="badge">⚠️ ${label}</span> <small>D-${d}</small>`};
  return {cls:'',txt:`${label} <small>D-${d}</small>`};
}

/* ===== 헤더/탭 ===== */
function renderHeader(){
  const n=new Date();
  $('#todayLabel').innerHTML=`${n.getFullYear()}년 ${n.getMonth()+1}월 ${n.getDate()}일 (${DOW[n.getDay()]})`;
}
document.querySelectorAll('.main-tab').forEach(b=>b.onclick=()=>{
  tab=b.dataset.tab;
  document.querySelectorAll('.main-tab').forEach(x=>x.classList.toggle('on',x===b));
  $('#tab-sched').classList.toggle('hidden',tab!=='sched');
  $('#tab-comp').classList.toggle('hidden',tab!=='comp');
  render();
});
document.querySelectorAll('#viewSeg button').forEach(b=>b.onclick=()=>{
  view=b.dataset.v;
  document.querySelectorAll('#viewSeg button').forEach(x=>x.classList.toggle('on',x===b));
  render();
});
function shift(dir){
  const d=parse(cur);
  if(view==='month'){const x=new Date(d.getFullYear(),d.getMonth()+dir,1);const last=new Date(x.getFullYear(),x.getMonth()+1,0).getDate();cur=fmt(new Date(x.getFullYear(),x.getMonth(),Math.min(d.getDate(),last)))}
  else if(view==='week')cur=fmt(addDays(d,7*dir));
  else cur=fmt(addDays(d,dir));
  render();
}
$('#prevBtn').onclick=()=>shift(-1);
$('#nextBtn').onclick=()=>shift(1);
$('#todayBtn').onclick=()=>{cur=todayStr();render()};
$('#addSchedBtn').onclick=()=>schedForm(null,cur);
$('#addCoBtn').onclick=()=>coForm(null);
$('#search').oninput=e=>{query=e.target.value.trim().toLowerCase();renderCompanies()};

/* ===== 일정표 렌더 ===== */
function render(){
  renderHeader();
  if(tab==='sched')renderSchedule();else renderCompanies();
}
function weekStart(d){return addDays(d,-d.getDay())}

function renderSchedule(){
  const d=parse(cur), area=$('#calArea');
  let rangeFrom,rangeTo;
  if(view==='month'){
    $('#navTitle').textContent=`${d.getFullYear()}년 ${d.getMonth()+1}월`;
    area.innerHTML=monthHTML(d);
    rangeFrom=rangeTo=cur;
    $('#listTitle').textContent=`${dateKo(cur)} 일정`;
    area.querySelectorAll('.day-cell').forEach(c=>c.onclick=()=>{cur=c.dataset.d;render()});
  }else if(view==='week'){
    const ws=weekStart(d), we=addDays(ws,6);
    $('#navTitle').textContent=`${ws.getMonth()+1}.${ws.getDate()} ~ ${we.getMonth()+1}.${we.getDate()}`;
    area.innerHTML=timelineHTML(Array.from({length:7},(_,i)=>fmt(addDays(ws,i))),true);
    rangeFrom=fmt(ws);rangeTo=fmt(we);
    $('#listTitle').textContent='이번 주 일정 목록';
    area.querySelectorAll('.tl-head div[data-d]').forEach(c=>c.onclick=()=>{cur=c.dataset.d;view='day';syncSeg();render()});
  }else{
    $('#navTitle').textContent=dateKo(cur);
    area.innerHTML=timelineHTML([cur],false);
    rangeFrom=rangeTo=cur;
    $('#listTitle').textContent='오늘 일정 목록'.replace('오늘',cur===todayStr()?'오늘':'이 날');
  }
  area.querySelectorAll('[data-ev]').forEach(e=>e.onclick=ev=>{ev.stopPropagation();detail(e.dataset.ev)});
  // 목록
  const list=schedules.filter(s=>s.date>=rangeFrom&&s.date<=rangeTo).sort(byTime);
  const box=$('#schedList');
  if(!list.length){box.innerHTML='<div class="empty">등록된 일정이 없습니다</div>';return}
  let html='',last='';
  list.forEach(s=>{
    if(rangeFrom!==rangeTo&&s.date!==last){html+=`<div class="list-date">${dateKo(s.date)}</div>`;last=s.date}
    const t=TYPES[s.type]||TYPES.etc;
    html+=`<button class="item" style="border-left-color:${t.c}" data-ev="${s.id}">
      <span class="tm">${esc(s.start)}</span>
      <span class="tx"><b>${t.i} ${esc(s.title||t.l)}</b><small>${esc(coName(s.companyId))}${s.memo?' · '+esc(s.memo):''}</small></span></button>`;
  });
  box.innerHTML=html;
  box.querySelectorAll('[data-ev]').forEach(e=>e.onclick=()=>detail(e.dataset.ev));
}
function syncSeg(){document.querySelectorAll('#viewSeg button').forEach(x=>x.classList.toggle('on',x.dataset.v===view))}

function monthHTML(d){
  const first=new Date(d.getFullYear(),d.getMonth(),1);
  const start=addDays(first,-first.getDay());
  const t=todayStr();
  const counts={};
  schedules.forEach(s=>{(counts[s.date]=counts[s.date]||[]).push(s)});
  let h='<div class="month-head">'+DOW.map(x=>`<div>${x}</div>`).join('')+'</div><div class="month-grid">';
  for(let i=0;i<42;i++){
    const x=addDays(start,i), k=fmt(x), ev=counts[k]||[];
    if(i>=35&&x.getMonth()!==d.getMonth())break;
    const cls=['day-cell'];
    if(x.getMonth()!==d.getMonth())cls.push('other');
    if(k===t)cls.push('today');
    if(k===cur)cls.push('sel');
    if(x.getDay()===0)cls.push('sun');
    if(x.getDay()===6)cls.push('sat');
    const types=[...new Set(ev.map(s=>s.type))].slice(0,4);
    h+=`<button class="${cls.join(' ')}" data-d="${k}"><span class="num">${x.getDate()}</span>`+
      (ev.length?`<span class="cnt">${ev.length}</span><span class="dots">${types.map(ty=>`<i class="dot" style="background:${(TYPES[ty]||TYPES.etc).c}"></i>`).join('')}</span>`:'')+'</button>';
  }
  return h+'</div>';
}

/* 겹치는 일정 배치 */
function layout(evs){
  const items=evs.map(s=>({s,a:toMin(s.start),b:endOf(s)})).sort((x,y)=>x.a-y.a||y.b-x.b);
  let cluster=[],clusterEnd=-1;
  const flush=()=>{const n=Math.max(0,...cluster.map(i=>i.col+1));cluster.forEach(i=>i.n=n);cluster=[]};
  items.forEach(it=>{
    if(cluster.length&&it.a>=clusterEnd){flush();clusterEnd=-1}
    const used=cluster.filter(c=>c.b>it.a).map(c=>c.col);
    let col=0;while(used.includes(col))col++;
    it.col=col;cluster.push(it);clusterEnd=Math.max(clusterEnd,it.b);
  });
  flush();
  return items;
}

function timelineHTML(dates,isWeek){
  const all=schedules.filter(s=>dates.includes(s.date));
  let sH=9,eH=18;
  all.forEach(s=>{sH=Math.min(sH,Math.floor(toMin(s.start)/60));eH=Math.max(eH,Math.ceil(endOf(s)/60))});
  eH=Math.min(eH,24);
  const HH=isWeek?46:56, total=(eH-sH)*HH, t=todayStr();
  const labelW=40, minW=isWeek?labelW+7*84:0;
  const cols=`${labelW}px repeat(${dates.length},minmax(0,1fr))`;
  let h=`<div class="tl-wrap"><div style="min-width:${minW}px">`;
  h+=`<div class="tl-head" style="grid-template-columns:${cols}"><div></div>`+dates.map(k=>{
    const d=parse(k);
    return `<div ${isWeek?`data-d="${k}" style="cursor:pointer"`:''} class="${k===t?'today':''}">${DOW[d.getDay()]}<br><b>${d.getDate()}</b></div>`;
  }).join('')+'</div>';
  h+=`<div class="tl" style="grid-template-columns:${cols};height:${total}px">`;
  h+='<div class="tl-hours">'+Array.from({length:eH-sH+1},(_,i)=>`<div class="tl-hour" style="top:${i*HH}px">${pad(sH+i)}:00</div>`).join('')+'</div>';
  dates.forEach(k=>{
    h+='<div class="tl-col">'+Array.from({length:eH-sH},(_,i)=>`<div class="tl-line" style="top:${i*HH}px"></div>`).join('');
    layout(all.filter(s=>s.date===k)).forEach(it=>{
      const s=it.s,t2=TYPES[s.type]||TYPES.etc;
      const top=(it.a-sH*60)/60*HH, ht=Math.max((it.b-it.a)/60*HH-2,18);
      const w=100/it.n;
      const sub=isWeek?'':`<span>${esc(coName(s.companyId))} · ${esc(s.start)}~${esc(toTime(it.b))}</span>`;
      h+=`<div class="ev ${isWeek?'':'day-ev'}" data-ev="${s.id}" style="top:${top}px;height:${ht}px;left:calc(${it.col*w}% + 1px);width:calc(${w}% - 2px);background:${t2.c};cursor:pointer" title="${esc(coName(s.companyId))}">
        <b>${t2.i} ${esc(isWeek?coName(s.companyId):(s.title||t2.l))}</b>${isWeek?`<span>${esc(s.title||t2.l)}</span>`:sub}</div>`;
    });
    if(k===t){
      const n=new Date(),m=n.getHours()*60+n.getMinutes();
      if(m>=sH*60&&m<=eH*60)h+=`<div class="nowline" style="top:${(m-sH*60)/60*HH}px"></div>`;
    }
    h+='</div>';
  });
  return h+'</div></div></div>';
}

/* ===== 업체 목록 ===== */
function renderCompanies(){
  const box=$('#coList');
  const list=companies.filter(c=>!query||(c.name+' '+c.address).toLowerCase().includes(query))
    .sort((a,b)=>a.name.localeCompare(b.name,'ko'));
  if(!list.length){box.innerHTML=`<div class="empty">${companies.length?'검색 결과가 없습니다':'등록된 업체가 없습니다.<br>아래 버튼으로 첫 업체를 추가하세요.'}</div>`;return}
  box.innerHTML=list.map(c=>{
    const a=warnInfo(c.inspectionDate), b=warnInfo(c.insuranceDate);
    return `<div class="co">
      <h3>🏢 ${esc(c.name)}</h3>
      <div class="row">📍 ${esc(c.address)}</div>
      ${c.phone?`<div class="row">📞 <a href="tel:${esc(c.phone)}" style="color:inherit">${esc(c.phone)}</a>${c.manager?' · '+esc(c.manager):''}</div>`:(c.manager?`<div class="row">👤 ${esc(c.manager)}</div>`:'')}
      <div class="dates">
        <div class="dbox ${a.cls}"><small>다음 검사일</small>${a.txt}</div>
        <div class="dbox ${b.cls}"><small>보험 만기일</small>${b.txt}</div>
      </div>
      ${c.memo?`<div class="row" style="color:var(--muted)">📝 ${esc(c.memo)}</div>`:''}
      <div class="acts"><button class="btn ghost" data-edit="${c.id}">수정</button><button class="btn danger" data-del="${c.id}">삭제</button></div>
    </div>`;
  }).join('');
  box.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>coForm(b.dataset.edit));
  box.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>delCompany(b.dataset.del));
}

/* ===== 모달 ===== */
function openModal(html){
  closeModal();
  const o=document.createElement('div');o.className='overlay';
  o.innerHTML=`<div class="modal" role="dialog">${html}</div>`;
  o.addEventListener('mousedown',e=>{if(e.target===o)closeModal()});
  $('#modalRoot').appendChild(o);
  return o.firstChild;
}
function closeModal(){$('#modalRoot').innerHTML=''}

function coForm(id){
  const c=id?companies.find(x=>x.id===id):{};
  const m=openModal(`<h2>${id?'업체 수정':'업체 등록'}</h2>
    <div class="fld"><label>업체명 *</label><input id="f_name" value="${esc(c.name)}" maxlength="60"></div>
    <div class="fld"><label>주소 *</label><input id="f_addr" value="${esc(c.address)}"></div>
    <div class="fld2">
      <div class="fld"><label>연락처</label><input id="f_phone" type="tel" value="${esc(c.phone)}"></div>
      <div class="fld"><label>담당자명</label><input id="f_mgr" value="${esc(c.manager)}"></div>
    </div>
    <div class="fld2">
      <div class="fld"><label>정기 검사일</label><input id="f_insp" type="date" value="${esc(c.inspectionDate)}"></div>
      <div class="fld"><label>보험 만기일</label><input id="f_ins" type="date" value="${esc(c.insuranceDate)}"></div>
    </div>
    <div class="fld"><label>비고</label><textarea id="f_memo">${esc(c.memo)}</textarea></div>
    <div class="err" id="err"></div>
    <div class="m-acts"><button class="btn ghost" id="cancel">취소</button><button class="btn gold" id="save">저장</button></div>`);
  m.querySelector('#cancel').onclick=closeModal;
  m.querySelector('#save').onclick=()=>{
    const v=i=>m.querySelector(i).value.trim();
    const name=v('#f_name'),address=v('#f_addr');
    if(!name||!address){m.querySelector('#err').textContent='업체명과 주소는 필수입니다.';return}
    const rec={id:id||uid(),name,address,phone:v('#f_phone'),manager:v('#f_mgr'),inspectionDate:v('#f_insp'),insuranceDate:v('#f_ins'),memo:v('#f_memo')};
    if(id)companies[companies.findIndex(x=>x.id===id)]=rec;else companies.push(rec);
    const n=syncAutoSchedules(rec);
    persist();closeModal();render();
    toast(n?`✅ 저장됨 · 자동 일정 ${n}건 생성`:'✅ 저장되었습니다');
  };
  m.querySelector('#f_name').focus();
}

function delCompany(id){
  const c=companies.find(x=>x.id===id);if(!c)return;
  const n=schedules.filter(s=>s.companyId===id).length;
  if(!confirm(`'${c.name}' 업체를 삭제할까요?${n?`\n연결된 일정 ${n}건도 함께 삭제됩니다.`:''}`))return;
  companies=companies.filter(x=>x.id!==id);
  schedules=schedules.filter(s=>s.companyId!==id);
  persist();render();toast('🗑️ 삭제되었습니다');
}

function schedForm(id,date){
  if(!companies.length){
    const m=openModal(`<h2>일정 등록</h2><div class="empty">먼저 업체를 등록해 주세요.</div><div class="m-acts"><button class="btn ghost" id="cancel">닫기</button><button class="btn gold" id="goco">업체 등록하기</button></div>`);
    m.querySelector('#cancel').onclick=closeModal;
    m.querySelector('#goco').onclick=()=>{closeModal();document.querySelector('[data-tab=comp]').click();coForm(null)};
    return;
  }
  const s=id?schedules.find(x=>x.id===id):{date:date||todayStr(),start:'09:00',end:'10:00',type:'repair'};
  const m=openModal(`<h2>${id?'일정 수정':'일정 등록'}</h2>
    <div class="fld"><label>날짜 *</label><input id="f_date" type="date" value="${esc(s.date)}"></div>
    <div class="fld2">
      <div class="fld"><label>시작 시간 *</label><input id="f_st" type="time" value="${esc(s.start)}"></div>
      <div class="fld"><label>종료 시간</label><input id="f_en" type="time" value="${esc(s.end)}"></div>
    </div>
    <div class="fld"><label>업체 *</label><select id="f_co"><option value="">업체 선택</option>${companies.map(c=>`<option value="${c.id}" ${c.id===s.companyId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
    <div class="fld"><label>종류 *</label><select id="f_ty">${Object.entries(TYPES).map(([k,t])=>`<option value="${k}" ${k===s.type?'selected':''}>${t.i} ${t.l}</option>`).join('')}</select></div>
    <div class="fld"><label>내용/메모</label><textarea id="f_memo">${esc(s.memo)}</textarea></div>
    <div class="err" id="err"></div>
    <div class="m-acts"><button class="btn ghost" id="cancel">취소</button><button class="btn gold" id="save">저장</button></div>`);
  m.querySelector('#cancel').onclick=closeModal;
  m.querySelector('#save').onclick=()=>{
    const v=i=>m.querySelector(i).value.trim();
    const date=v('#f_date'),start=v('#f_st'),end=v('#f_en'),co=v('#f_co'),type=v('#f_ty');
    const err=t=>m.querySelector('#err').textContent=t;
    if(!date||!start||!co||!type)return err('날짜, 시작 시간, 업체, 종류는 필수입니다.');
    if(end&&toMin(end)<=toMin(start))return err('종료 시간은 시작 시간보다 늦어야 합니다.');
    const rec=Object.assign({},s,{id:id||uid(),date,start,end,companyId:co,type,memo:v('#f_memo')});
    if(id)schedules[schedules.findIndex(x=>x.id===id)]=rec;else schedules.push(rec);
    persist();cur=date;closeModal();render();toast('✅ 저장되었습니다');
  };
}

function detail(id){
  const s=schedules.find(x=>x.id===id);if(!s)return;
  const t=TYPES[s.type]||TYPES.etc, co=companies.find(c=>c.id===s.companyId);
  const m=openModal(`<h2>일정 상세</h2>
    <div class="detail-row"><span>종류</span><span><span class="tag" style="background:${t.c}">${t.i} ${t.l}</span>${s.title?' '+esc(s.title):''}</span></div>
    <div class="detail-row"><span>날짜</span><span>${dateKo(s.date)}</span></div>
    <div class="detail-row"><span>시간</span><span>${esc(s.start)}${s.end?' ~ '+esc(s.end):''}</span></div>
    <div class="detail-row"><span>업체</span><span>${esc(coName(s.companyId))}${co&&co.phone?`<br><a href="tel:${esc(co.phone)}">📞 ${esc(co.phone)}</a>`:''}${co?`<br><small style="color:var(--muted)">📍 ${esc(co.address)}</small>`:''}</span></div>
    <div class="detail-row"><span>메모</span><span>${s.memo?esc(s.memo).replace(/\n/g,'<br>'):'-'}</span></div>
    <div class="m-acts" style="margin-top:14px"><button class="btn ghost" id="close">닫기</button><button class="btn" id="edit">수정</button><button class="btn danger" id="del">삭제</button></div>`);
  m.querySelector('#close').onclick=closeModal;
  m.querySelector('#edit').onclick=()=>schedForm(id);
  m.querySelector('#del').onclick=()=>{
    if(!confirm('이 일정을 삭제할까요?'))return;
    schedules=schedules.filter(x=>x.id!==id);persist();closeModal();render();toast('🗑️ 삭제되었습니다');
  };
}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
render();
</script>

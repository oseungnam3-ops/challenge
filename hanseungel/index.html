<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c2340">
<title>🛗 승강기 관리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --navy:#0c2340; --navy2:#16355e; --gold:#c9a962; --gold-d:#a88a43; --bg:#f2f4f8; --card:#fff;
  --text:#1b2433; --muted:#6b7686; --line:#e3e7ee; --danger:#d93636; --warn:#e08a00;
  --repair:#2f6fdd; --replace:#f08a1c; --install:#2e9e5b; --inspect:#7a4fd1; --insure:#d93636; --etc:#7b8494;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.app{max-width:960px;margin:0 auto;min-height:100vh;padding-bottom:40px}

/* header */
header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:16px 16px 0;border-radius:0 0 24px 24px;position:sticky;top:0;z-index:20;box-shadow:0 4px 16px rgba(12,35,64,.25)}
.hd-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{font-size:19px;font-weight:800;letter-spacing:-.3px}
.logo span{color:var(--gold)}
.hd-r{display:flex;align-items:center;gap:8px}
.set-btn{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.14);font-size:17px;line-height:1}
.today-label{font-size:13px;color:var(--gold);font-weight:600;text-align:right}
.main-tabs{display:flex;gap:6px;margin-top:12px}
.main-tab{flex:1;padding:11px 0 12px;color:rgba(255,255,255,.65);font-weight:700;font-size:15px;border-bottom:3px solid transparent}
.main-tab.on{color:#fff;border-bottom-color:var(--gold)}

main{padding:16px}
.card{background:var(--card);border-radius:18px;box-shadow:0 2px 10px rgba(12,35,64,.07);padding:16px}
.hidden{display:none!important}

/* buttons */
.btn{padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;background:var(--navy);color:#fff}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn.ghost{background:#eef1f6;color:var(--navy)}
.btn.danger{background:#fdeaea;color:var(--danger)}
.btn.block{width:100%;padding:14px;font-size:15px}
.btn:active{transform:scale(.98)}

/* toolbar */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.seg{display:flex;background:#e6eaf1;border-radius:14px;padding:3px;flex:1;min-width:230px}
.seg button{flex:1;padding:9px 4px;border-radius:11px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--navy);color:#fff}
.nav{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.nav .title{flex:1;text-align:center;font-weight:800;font-size:17px;color:var(--navy)}
.nav button{width:38px;height:38px;border-radius:12px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.08);font-size:18px;color:var(--navy);font-weight:800}
.nav .today-btn{width:auto;padding:0 14px;font-size:13px;background:var(--gold);color:var(--navy)}

/* month */
.month-head,.month-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.month-head div{text-align:center;font-size:12px;font-weight:700;color:var(--muted);padding:4px 0 8px}
.month-head div:first-child,.day-cell.sun .num{color:var(--danger)}
.month-head div:last-child,.day-cell.sat .num{color:var(--repair)}
.day-cell{min-height:62px;border-top:1px solid var(--line);padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:0;background:none}
.day-cell.other{opacity:.35}
.day-cell .num{width:26px;height:26px;line-height:26px;border-radius:50%;text-align:center;font-size:13px;font-weight:700}
.day-cell.today .num{background:var(--navy);color:#fff}
.day-cell.sel{background:#fbf6e8}
.day-cell.sel .num{outline:2px solid var(--gold)}
.cnt{font-size:11px;font-weight:700;background:var(--gold);color:var(--navy);border-radius:9px;padding:0 6px}
.dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
.dot{width:6px;height:6px;border-radius:50%}

/* timeline */
.tl-wrap{overflow-x:auto}
.tl{position:relative;display:grid}
.tl-hours{position:relative}
.tl-hour{position:absolute;left:0;right:0;font-size:11px;color:var(--muted);padding-left:2px;transform:translateY(-7px)}
.tl-col{position:relative;border-left:1px solid var(--line)}
.tl-line{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.tl-head{display:grid;position:sticky;top:0}
.tl-head div{text-align:center;font-size:12px;font-weight:700;padding:6px 0;color:var(--muted)}
.tl-head div.today{color:var(--navy)}
.tl-head div.today b{background:var(--navy);color:#fff;border-radius:10px;padding:1px 7px}
.tl-head div b{font-size:14px}
.ev{position:absolute;border-radius:8px;padding:3px 5px;color:#fff;font-size:11px;line-height:1.25;overflow:hidden;text-align:left;border-left:4px solid rgba(0,0,0,.25);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.ev b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.day-ev{font-size:13px;padding:6px 10px}
.ev.day-ev b{font-size:14px}
.nowline{position:absolute;left:0;right:0;border-top:2px solid var(--danger);z-index:3;pointer-events:none}

/* list */
.sec-title{font-weight:800;color:var(--navy);margin:18px 2px 8px;font-size:15px}
.list-date{font-size:13px;font-weight:700;color:var(--muted);margin:10px 2px 6px}
.item{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:#fff;border-radius:14px;padding:12px;margin-bottom:8px;box-shadow:0 1px 6px rgba(12,35,64,.06);border-left:6px solid var(--etc)}
.item .tm{font-size:12px;font-weight:700;color:var(--muted);min-width:46px}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .tx small{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:28px 8px}

/* companies */
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;margin-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.chip{flex:0 0 auto;padding:7px 13px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:700}
.grp-tg{display:flex;justify-content:flex-end;margin-bottom:8px}
.grp-h{font-weight:700;margin:14px 2px 8px;padding-bottom:4px;border-bottom:2px solid var(--gold)}
.search{width:100%;padding:13px 16px;border-radius:14px;border:1.5px solid var(--line);background:#fff;margin-bottom:12px;outline:none}
.search:focus,.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--gold)}
.co{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(12,35,64,.07);border-top:4px solid var(--gold)}
.co h3{color:var(--navy);font-size:17px;margin-bottom:4px}
.co .row{font-size:14px;color:#3a4558;margin:2px 0;word-break:break-all}
.co .dates{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.dbox{background:#f6f8fb;border-radius:12px;padding:8px 10px;font-size:13px}
.dbox small{display:block;color:var(--muted);font-size:11px}
.dbox.w{background:#fff4e0}.dbox.u{background:#fdeaea}
.dbox .badge{font-weight:800}
.co .acts{display:flex;gap:8px;margin-top:8px}
.co .acts .btn{flex:1}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(8,20,40,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
@media(min-width:600px){.overlay{align-items:center}.modal{border-radius:24px}}
.modal h2{color:var(--navy);font-size:19px;margin-bottom:14px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:13px;font-weight:700;color:var(--navy);margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;outline:none}
.fld textarea{min-height:80px;resize:vertical}
.fld2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--danger);font-size:13px;margin-bottom:8px;min-height:0}
.m-acts{display:flex;gap:8px;margin-top:6px}
.m-acts .btn{flex:1;padding:13px}
.mw{margin-top:14px;border:1.5px solid var(--gold);border-radius:14px;background:#fff}
.mw summary{cursor:pointer;padding:13px 14px;font-weight:800;font-size:14px;color:var(--navy);list-style:none;min-height:44px;display:flex;align-items:center;justify-content:space-between}
.mw summary::-webkit-details-marker{display:none}
.mw summary::after{content:'▾';color:var(--gold-d);transition:transform .2s}
.mw[open] summary::after{transform:rotate(180deg)}
.mw-body{padding:0 12px 12px;display:grid;gap:8px}
.mw-btn{display:flex;align-items:center;min-height:48px;padding:12px 14px;border:1.5px solid var(--navy);border-radius:12px;color:var(--navy);font-weight:700;font-size:14px;text-decoration:none;background:#fff}
.mw-btn:active{background:var(--navy);color:#fff}
.mw-note{font-size:12px;color:#7a8499;text-align:center;margin-top:2px}
.detail-row{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.detail-row span:first-child{min-width:64px;color:var(--muted);font-weight:700}
.tag{display:inline-block;color:#fff;border-radius:10px;padding:2px 10px;font-size:12px;font-weight:700}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:14px;z-index:99;font-size:14px;box-shadow:0 4px 16px rgba(0,0,0,.3)}
/* map */
.map-card{padding:8px;position:relative}
.map-box{width:100%;height:calc(100vh - 250px);min-height:380px;border-radius:14px;overflow:hidden;background:#e9edf3;touch-action:pan-x pan-y}
.map-msg{position:absolute;inset:8px;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:var(--muted);font-weight:700;background:#e9edf3;border-radius:14px;z-index:5}
.map-fab{position:absolute;right:18px;bottom:22px;z-index:6;padding:11px 14px;border-radius:999px;background:var(--navy);color:var(--gold);font-weight:800;font-size:14px;box-shadow:0 3px 12px rgba(0,0,0,.3)}
.map-stat{font-size:12px;color:var(--muted);margin:0 2px 8px}
.iw{padding:12px 14px;min-width:210px;max-width:260px;font-size:13px;line-height:1.45;color:var(--text)}
.iw b{display:block;font-size:15px;color:var(--navy);margin-bottom:4px}
.iw .r{margin:2px 0;word-break:break-all}
.iw .ia{display:flex;gap:6px;margin-top:8px}
.iw .ia button{flex:1;padding:9px 4px;border-radius:10px;font-weight:700;font-size:13px;background:var(--navy);color:#fff}
.iw .ia button.g{background:var(--gold);color:var(--navy)}
.co .acts.map-acts{margin-top:8px}
@media(max-width:480px){.day-cell{min-height:54px}main{padding:12px}.map-box{height:calc(100vh - 230px)}}
/* 공단 연동 */
.gdrow{background:#eef3fb;border-radius:12px;padding:8px 10px;font-size:13px;margin:8px 0}
.gd-l{display:flex;justify-content:space-between;gap:8px;margin-top:3px}
.gd-l.w{color:#9a5b00}.gd-l.u{color:var(--danger)}
.gd-l .badge,.gdrow .badge{font-weight:800}
.gdbanner{background:#fff4e0;border-radius:14px;padding:10px 12px;margin-bottom:12px;font-size:13px}
.gdbanner button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;padding:6px 0;border-top:1px solid rgba(0,0,0,.06);margin-top:4px;font-size:13px}
.gd-el{margin-bottom:14px}
.gd-h{font-weight:800;color:var(--navy);margin-bottom:2px}
.gd-sub{font-size:12px;color:var(--muted);margin-bottom:4px}
.gd-note{background:#f6f8fb;border-radius:12px;padding:12px;font-size:13px;color:var(--muted)}
.gd-note.err{background:#fdeaea;color:var(--danger)}
.gd-src{font-size:11px;color:var(--muted);margin:10px 2px 12px}
.gd-errs{font-size:12px;color:var(--muted);margin-top:8px}.gd-errs div{margin-top:6px}
.gd-load{display:flex;align-items:center;gap:10px;justify-content:center;padding:26px 8px;color:var(--muted);font-weight:700}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:gdspin .8s linear infinite}
@keyframes gdspin{to{transform:rotate(360deg)}}
.tl2{border-left:2px solid var(--line);margin:4px 0 4px 6px;padding-left:14px}
.tl2-i{position:relative;padding:0 0 12px;font-size:13px}
.tl2-i:before{content:"";position:absolute;left:-20px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--gold);border:2px solid #fff;box-shadow:0 0 0 1px var(--gold)}
.tl2-i.bad:before{background:var(--danger);box-shadow:0 0 0 1px var(--danger)}
.tl2-d{font-weight:700;color:var(--navy)}
.tl2-i small{color:var(--muted)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="hd-top">
      <div class="logo">🛗 승강기 <span>관리</span></div>
      <div class="hd-r"><div class="today-label" id="todayLabel"></div><button class="set-btn" id="settingsBtn" aria-label="설정">⚙️</button></div>
    </div>
    <div class="main-tabs">
      <button class="main-tab on" data-tab="sched">📋 일정표</button>
      <button class="main-tab" data-tab="comp">🏢 업체 관리</button>
      <button class="main-tab" data-tab="map">🗺️ 지도</button>
    </div>
  </header>

  <main>
    <section id="tab-sched">
      <div class="toolbar">
        <div class="seg" id="viewSeg">
          <button data-v="month" class="on">📅 월별</button>
          <button data-v="week">📊 주별</button>
          <button data-v="day">📋 일별</button>
        </div>
      </div>
      <div class="nav">
        <button id="prevBtn" aria-label="이전">‹</button>
        <div class="title" id="navTitle"></div>
        <button id="nextBtn" aria-label="다음">›</button>
        <button class="today-btn" id="todayBtn">오늘</button>
      </div>
      <div class="card" id="calArea"></div>
      <div class="sec-title" id="listTitle">일정 목록</div>
      <div id="schedList"></div>
      <button class="btn gold block" id="addSchedBtn">+ 일정 추가</button>
    </section>

    <section id="tab-comp" class="hidden">
      <div id="gdBanner"></div>
      <input class="search" id="search" type="search" placeholder="🔍 업체명 또는 주소로 검색">
      <div class="chips" id="regionChips"></div>
      <div class="grp-tg"><button class="chip" id="groupBtn">그룹으로 보기</button></div>
      <div id="coList"></div>
      <button class="btn gold block" id="addCoBtn">+ 업체 추가</button>
      <button class="btn ghost block" id="importBtn" style="margin-top:8px">📥 엑셀 가져오기</button>
    </section>

    <section id="tab-map" class="hidden">
      <div class="chips" id="mapChips"></div>
      <div class="map-stat" id="mapStat"></div>
      <div class="card map-card">
        <div class="map-box" id="mapBox"></div>
        <div class="map-msg hidden" id="mapMsg"></div>
        <button class="map-fab" id="myLocBtn">📍 내 위치</button>
      </div>
    </section>
  </main>
</div>
<div id="modalRoot"></div>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script>
'use strict';
/* ===== 상수 ===== */
const KEY_C='elevatorApp_companies', KEY_S='elevatorApp_schedules';
const TYPES={
  repair:{l:'수리',i:'🔧',c:'#2f6fdd'},
  replace:{l:'교체',i:'🔄',c:'#f08a1c'},
  install:{l:'설치',i:'🏗️',c:'#2e9e5b'},
  inspect:{l:'검사',i:'📋',c:'#7a4fd1'},
  insure:{l:'보험',i:'🛡️',c:'#d93636'},
  etc:{l:'기타',i:'📝',c:'#7b8494'}
};
const DOW=['일','월','화','수','목','금','토'];
const AUTO={
  insp:{type:'inspect',base:'inspectionDate',rules:[[30,'검사 준비'],[7,'검사 임박'],[0,'정기 검사']]},
  ins:{type:'insure',base:'insuranceDate',rules:[[30,'보험 갱신 준비'],[7,'보험 만기 임박'],[0,'보험 만기']]}
};

/* ===== 유틸 ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);return x};
const todayStr=()=>fmt(new Date());
const toMin=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};
const toTime=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const daysUntil=s=>Math.round((parse(s)-parse(todayStr()))/86400000);
const dateKo=s=>{const d=parse(s);return `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()} (${DOW[d.getDay()]})`};

function load(k){try{const v=JSON.parse(localStorage.getItem(k));return Array.isArray(v)?v:[]}catch(e){return []}}
function persist(){
  try{localStorage.setItem(KEY_C,JSON.stringify(companies));localStorage.setItem(KEY_S,JSON.stringify(schedules))}
  catch(e){toast('⚠️ 저장 실패: 브라우저 저장소를 확인하세요')}
}
function toast(msg){
  const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);
  setTimeout(()=>t.remove(),2200);
}

/* ===== 상태 ===== */
let companies=load(KEY_C), schedules=load(KEY_S);

/* ===== 데이터 마이그레이션: region 필드만 채움 (다른 필드는 건드리지 않음) ===== */
const KEY_DATAVER='elevatorApp_dataVersion', DATA_VERSION='2';
function guessRegion(addr){
  const a=String(addr||'');
  const p=a.match(/\(([^()]*)\)\s*$/);
  if(p){const t=p[1].split(',').pop().trim();if(t)return t}
  const m=a.match(/[가-힣0-9]+(?:동|읍|면)(?=[\s\d]|$)/)||a.match(/[가-힣]+구(?=[\s\d]|$)/);
  return m?m[0]:'';
}
function migrateRegions(){
  let changed=false;
  const hasRegion=c=>String(c.region||'').trim()!=='';
  if(companies.some(c=>!hasRegion(c))){
    const seedMap={};
    INITIAL_COMPANIES.forEach(i=>{if(i.region)seedMap[i.name+'\u0000'+i.address]=i.region});
    companies.forEach(c=>{
      if(hasRegion(c))return;
      c.region=seedMap[c.name+'\u0000'+c.address]||guessRegion(c.address)||'기타';
      changed=true;
    });
  }
  if(changed)persist();
  try{localStorage.setItem(KEY_DATAVER,DATA_VERSION)}catch(e){}
  return changed;
}
(function(){
  let v=null;try{v=localStorage.getItem(KEY_DATAVER)}catch(e){}
  if(v!==DATA_VERSION)migrateRegions();
})();

/* ===== 자동 일정 ===== */
function syncAutoSchedules(co){
  const today=todayStr();
  let added=0;
  Object.keys(AUTO).forEach(kind=>{
    const cfg=AUTO[kind], base=co[cfg.base];
    // 기준일이 바뀌어 더 이상 맞지 않는 자동 일정 제거
    schedules=schedules.filter(s=>!(s.auto&&s.companyId===co.id&&s.auto.startsWith(kind+':')&&!s.auto.endsWith(':'+base)));
    if(!base)return;
    cfg.rules.forEach(([off,title])=>{
      const date=fmt(addDays(parse(base),-off));
      if(date<today)return; // 이미 지난 날짜는 생성하지 않음
      const key=`${kind}:${off}:${base}`;
      if(schedules.some(s=>s.companyId===co.id&&s.auto===key))return; // 중복 방지
      schedules.push({id:uid(),date,start:'09:00',end:'10:00',companyId:co.id,type:cfg.type,title,memo:'자동 생성 일정',auto:key});
      added++;
    });
  });
  return added;
}

function warnInfo(dateStr){
  if(!dateStr)return {cls:'',txt:'-'};
  const d=daysUntil(dateStr);
  const label=dateKo(dateStr);
  if(d<0)return {cls:'',txt:`${label} <small>(${-d}일 지남)</small>`};
  if(d<=7)return {cls:'u',txt:`<span class="badge">🔴 ${label}</span> <small>${d===0?'오늘':'D-'+d}</small>`};
  if(d<=30)return {cls:'w',txt:`<span class="badge">⚠️ ${label}</span> <small>D-${d}</small>`};
  return {cls:'',txt:`${label} <small>D-${d}</small>`};
}

const COL_MAP={
  name:['업체명','건물명','업체','건물','상호','상호명'],
  address:['주소','소재지','설치장소'],
  phone:['연락처','전화번호','전화','휴대폰','핸드폰'],
  manager:['담당자','관리자','담당자명','관리자명'],
  inspectionDate:['검사일','유효기간','정기검사일','다음검사일','검사유효기간'],
  region:['지역','지역명','구역','region'],
  insuranceDate:['보험만기일','보험만료일','보험만기','보험만료','보험종료일']
};
const normKey=k=>String(k).replace(/[\s_\-()]/g,'').toLowerCase();
function xlDate(v){
  if(v==null||v==='')return '';
  if(v instanceof Date&&!isNaN(v))return fmt(v);
  if(typeof v==='number'){const o=XLSX.SSF.parse_date_code(v);return o?`${o.y}-${pad(o.m)}-${pad(o.d)}`:''}
  const m=String(v).trim().match(/^(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
  return m?`${m[1]}-${pad(+m[2])}-${pad(+m[3])}`:'';
}
function parseSheet(wb){
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:'',raw:true,cellDates:true});
  const out=[];
  rows.forEach(r=>{
    const f={};
    Object.keys(r).forEach(k=>{
      const nk=normKey(k);
      for(const t in COL_MAP){if(f[t]===undefined&&COL_MAP[t].some(a=>normKey(a)===nk))f[t]=r[k]}
    });
    const name=String(f.name||'').trim(),address=String(f.address||'').trim();
    if(!name||!address)return;
    out.push({name,address,phone:String(f.phone||'').trim(),manager:String(f.manager||'').trim(),
      inspectionDate:xlDate(f.inspectionDate),insuranceDate:xlDate(f.insuranceDate),memo:'',region:String(f.region||'').trim()});
  });
  return {total:rows.length,list:out};
}
const coKey=c=>(c.name+'|'+c.address).replace(/\s+/g,'').toLowerCase();
function importForm(){
  if(typeof XLSX==='undefined'){toast('⚠️ 엑셀 라이브러리를 불러오지 못했습니다 (인터넷 연결 확인)');return}
  const m=openModal(`<h2>📥 엑셀 가져오기</h2>
    <div class="fld"><label>엑셀 파일 (.xlsx, .xls, .csv)</label><input id="f_file" type="file" accept=".xlsx,.xls,.csv"></div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:10px">필요 컬럼: 업체명(건물명), 주소, 연락처, 담당자, 검사일(유효기간), 보험만기일 (선택: 지역)</div>
    <div id="impInfo" style="font-size:14px;margin-bottom:10px"></div>
    <div class="err" id="err"></div>
    <div class="m-acts"><button class="btn ghost" id="cancel">취소</button><button class="btn gold" id="reg" disabled>등록</button></div>`);
  let parsed=[];
  m.querySelector('#cancel').onclick=closeModal;
  m.querySelector('#f_file').onchange=e=>{
    const file=e.target.files[0],info=m.querySelector('#impInfo'),err=m.querySelector('#err'),reg=m.querySelector('#reg');
    err.textContent='';info.textContent='';reg.disabled=true;parsed=[];
    if(!file)return;
    const rd=new FileReader();
    rd.onload=()=>{
      try{
        const r=parseSheet(XLSX.read(rd.result,{type:'array',cellDates:true}));
        parsed=r.list;
        if(!parsed.length){err.textContent='읽을 수 있는 업체가 없습니다. 컬럼명(업체명, 주소)을 확인하세요.';return}
        const have=new Set(companies.map(coKey));
        const dup=parsed.filter(c=>have.has(coKey(c))).length;
        info.innerHTML=`📄 <b>${parsed.length}개</b> 업체를 읽었습니다.<br>신규 <b>${parsed.length-dup}개</b> · 중복 <b>${dup}개</b> (건너뜀)${r.total>parsed.length?`<br><small>업체명/주소가 없는 ${r.total-parsed.length}행 제외</small>`:''}`;
        reg.disabled=false;
      }catch(ex){err.textContent='파일을 읽는 중 오류가 발생했습니다.'}
    };
    rd.onerror=()=>{err.textContent='파일을 읽을 수 없습니다.'};
    rd.readAsArrayBuffer(file);
  };
  m.querySelector('#reg').onclick=()=>{
    const have=new Set(companies.map(coKey));
    let added=0,skipped=0,sched=0;
    parsed.forEach(c=>{
      const k=coKey(c);
      if(have.has(k)){skipped++;return}
      have.add(k);
      const rec=Object.assign({id:uid()},c);
      companies.push(rec);sched+=syncAutoSchedules(rec);added++;
    });
    persist();closeModal();render();
    toast(`✅ ${added}개 등록 · 중복 ${skipped}개 건너뜀${sched?` · 일정 ${sched}건 생성`:''}`);
  };
}

function monthHTML(d){
  const first=new Date(d.getFullYear(),d.getMonth(),1);
  const start=addDays(first,-first.getDay());
  const t=todayStr();
  const counts={};
  schedules.forEach(s=>{(counts[s.date]=counts[s.date]||[]).push(s)});
  let h='<div class="month-head">'+DOW.map(x=>`<div>${x}</div>`).join('')+'</div><div class="month-grid">';
  for(let i=0;i<42;i++){
    const x=addDays(start,i), k=fmt(x), ev=counts[k]||[];
    if(i>=35&&x.getMonth()!==d.getMonth())break;
    const cls=['day-cell'];
    if(x.getMonth()!==d.getMonth())cls.push('other');
    if(k===t)cls.push('today');
    if(k===cur)cls.push('sel');
    if(x.getDay()===0)cls.push('sun');
    if(x.getDay()===6)cls.push('sat');
    const types=[...new Set(ev.map(s=>s.type))].slice(0,4);
    h+=`<button class="${cls.join(' ')}" data-d="${k}"><span class="num">${x.getDate()}</span>`+
      (ev.length?`<span class="cnt">${ev.length}</span><span class="dots">${types.map(ty=>`<i class="dot" style="background:${(TYPES[ty]||TYPES.etc).c}"></i>`).join('')}</span>`:'')+'</button>';
  }
  return h+'</div>';
}

/* 겹치는 일정 배치 */
function layout(evs){
  const items=evs.map(s=>({s,a:toMin(s.start),b:endOf(s)})).sort((x,y)=>x.a-y.a||y.b-x.b);
  let cluster=[],clusterEnd=-1;
  const flush=()=>{const n=Math.max(0,...cluster.map(i=>i.col+1));cluster.forEach(i=>i.n=n);cluster=[]};
  items.forEach(it=>{
    if(cluster.length&&it.a>=clusterEnd){flush();clusterEnd=-1}
    const used=cluster.filter(c=>c.b>it.a).map(c=>c.col);
    let col=0;while(used.includes(col))col++;
    it.col=col;cluster.push(it);clusterEnd=Math.max(clusterEnd,it.b);
  });
  flush();
  return items;
}

function timelineHTML(dates,isWeek){
  const all=schedules.filter(s=>dates.includes(s.date));
  let sH=9,eH=18;
  all.forEach(s=>{sH=Math.min(sH,Math.floor(toMin(s.start)/60));eH=Math.max(eH,Math.ceil(endOf(s)/60))});
  eH=Math.min(eH,24);
  const HH=isWeek?46:56, total=(eH-sH)*HH, t=todayStr();
  const labelW=40, minW=isWeek?labelW+7*84:0;
  const cols=`${labelW}px repeat(${dates.length},minmax(0,1fr))`;
  let h=`<div class="tl-wrap"><div style="min-width:${minW}px">`;
  h+=`<div class="tl-head" style="grid-template-columns:${cols}"><div></div>`+dates.map(k=>{
    const d=parse(k);
    return `<div ${isWeek?`data-d="${k}" style="cursor:pointer"`:''} class="${k===t?'today':''}">${DOW[d.getDay()]}<br><b>${d.getDate()}</b></div>`;
  }).join('')+'</div>';
  h+=`<div class="tl" style="grid-template-columns:${cols};height:${total}px">`;
  h+='<div class="tl-hours">'+Array.from({length:eH-sH+1},(_,i)=>`<div class="tl-hour" style="top:${i*HH}px">${pad(sH+i)}:00</div>`).join('')+'</div>';
  dates.forEach(k=>{
    h+='<div class="tl-col">'+Array.from({length:eH-sH},(_,i)=>`<div class="tl-line" style="top:${i*HH}px"></div>`).join('');
    layout(all.filter(s=>s.date===k)).forEach(it=>{
      const s=it.s,t2=TYPES[s.type]||TYPES.etc;
      const top=(it.a-sH*60)/60*HH, ht=Math.max((it.b-it.a)/60*HH-2,18);
      const w=100/it.n;
      const sub=isWeek?'':`<span>${esc(coName(s.companyId))} · ${esc(s.start)}~${esc(toTime(it.b))}</span>`;
      h+=`<div class="ev ${isWeek?'':'day-ev'}" data-ev="${s.id}" style="top:${top}px;height:${ht}px;left:calc(${it.col*w}% + 1px);width:calc(${w}% - 2px);background:${t2.c};cursor:pointer" title="${esc(coName(s.companyId))}">
        <b>${t2.i} ${esc(isWeek?coName(s.companyId):(s.title||t2.l))}</b>${isWeek?`<span>${esc(s.title||t2.l)}</span>`:sub}</div>`;
    });
    if(k===t){
      const n=new Date(),m=n.getHours()*60+n.getMinutes();
      if(m>=sH*60&&m<=eH*60)h+=`<div class="nowline" style="top:${(m-sH*60)/60*HH}px"></div>`;
    }
    h+='</div>';
  });
  return h+'</div></div></div>';
}

const KEY_COORDS='elevatorApp_coords';
const KAKAO_SDK='https://dapi.kakao.com/v2/maps/sdk.js?appkey=9be40d4fed00a3fcb1504584a8774d18&libraries=services&autoload=false';
let coords={};
try{const v=JSON.parse(localStorage.getItem(KEY_COORDS));if(v&&typeof v==='object'&&!Array.isArray(v))coords=v}catch(e){}

const addrKey=c=>String(c.address||'').trim();

let mapState='idle'; // idle | loading | ready | error
let kmap=null, geocoder=null, markers={}, openIw=null, focusId=null, mapRegion='', geoRunning=false, geoFailed=new Set();
let myMarker=null, mapWaiters=[];

function loadKakao(cb){
  if(mapState==='ready')return cb(true);
  mapWaiters.push(cb);
  if(mapState==='loading')return;
  mapState='loading';
  const done=ok=>{mapState=ok?'ready':'error';const w=mapWaiters;mapWaiters=[];w.forEach(f=>f(ok))};
  const sc=document.createElement('script');
  sc.src=KAKAO_SDK;
  sc.onerror=()=>done(false);
  sc.onload=()=>{
    try{kakao.maps.load(()=>{try{geocoder=new kakao.maps.services.Geocoder();done(true)}catch(e){console.warn('[map] init',e);done(false)}})}
    catch(e){done(false)}
  };
  document.head.appendChild(sc);
  setTimeout(()=>{if(mapState==='loading')done(false)},10000);
}

const GEO_PREFIX=['','서울 강서구 ','서울 ','경기 고양시 ','경기 파주시 ','경기 김포시 ','경기 부천시 ','인천 '];
const cleanAddr=a=>String(a||'').replace(/\([^)]*\)/g,' ').replace(/,\s*\d+(-\d+)?\s*$/,'').replace(/\s+/g,' ').trim();
const geoOnce=q=>new Promise(res=>{
  try{geocoder.addressSearch(q,(r,st)=>{
    if(st===kakao.maps.services.Status.OK&&r&&r[0])res({lat:parseFloat(r[0].y),lng:parseFloat(r[0].x)});else res(null);
  })}catch(e){res(null)}

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function geocode(c){
  const base=cleanAddr(c.address);if(!base)return null;
  const hasCity=/^(서울|경기|인천|부산|대구|대전|광주|울산|세종|강원|충북|충남|전북|전남|경북|경남|제주)/.test(base);
  for(const pf of (hasCity?['']:GEO_PREFIX)){
    const r=await geoOnce(pf+base);
    if(r)return r;
    await sleep(60);
  }
  return null;
}
async function startGeocoding(){
  if(geoRunning||mapState!=='ready'||!geocoder)return;
  const todo=companies.filter(c=>!coordOf(c)&&!geoFailed.has(c.id)&&addrKey(c));
  if(!todo.length)return;
  geoRunning=true;
  let n=0;
  for(const c of todo){
    const dup=coordOf(c);if(dup)continue;
    const p=await geocode(c);
    if(p){coords[addrKey(c)]=p;n++;if(n%10===0)saveCoords();}
    else{geoFailed.add(c.id);console.warn('[geocode] 실패:',c.name,'|',c.address)}
    if(tab==='map'&&kmap){
      const vis=!mapRegion||regionOf(c)===mapRegion;
      if(p&&vis&&!markers[c.id])addOneMarker(c);

/* 오류 코드 → 사용자 메시지 */
function gdCodeErr(code,msg){
  code=String(code);
  if(['30','31','32','33','20'].includes(code))return gdErr('key','인증키가 등록되지 않았거나 이 서비스의 사용 승인이 아직 없습니다. 공공데이터포털에서 해당 API 활용 신청·승인 상태를 확인하세요.');
  if(code==='22')return gdErr('quota','API 일일 호출 한도를 초과했습니다. 내일 다시 시도해 주세요.');
  if(code==='12')return gdErr('key','공단 API 서비스가 폐기되었거나 주소가 변경되었습니다.');
  return gdErr('api','공단 서버 오류('+code+(msg?': '+msg:'')+')');
}
async function gdCall(src,no){
  const s=GD_SRC[src];
  const url=GD_BASE+s.svc+'/'+s.op+'?serviceKey='+GD_KEY+'&'+Object.entries(s.q(no)).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&');
  const ctl=new AbortController(), to=setTimeout(()=>ctl.abort(),12000);
  let res,txt;
  try{res=await fetch(url,{signal:ctl.signal});txt=await res.text()}
  catch(e){throw gdErr('net',e.name==='AbortError'?'응답 시간이 초과되었습니다. 잠시 후 다시 시도해 주세요.':'네트워크 오류로 공단 서버에 연결하지 못했습니다. 인터넷 연결을 확인하세요.')}
  finally{clearTimeout(to)}
  const doc=new DOMParser().parseFromString(txt,'text/xml');
  const t=sel=>{const n=doc.querySelector(sel);return n?n.textContent.trim():''};
  if(doc.querySelector('parsererror'))throw gdErr('api','공단 서버가 올바르지 않은 응답을 보냈습니다'+(res.ok?'':' (HTTP '+res.status+')')+'.');
  const code=t('returnReasonCode')||t('header > resultCode');
  if(code&&code!=='00'&&code!=='0')throw gdCodeErr(code,t('errMsg')||t('header > resultMsg'));
  if(!res.ok)throw gdErr('api','공단 서버 오류 (HTTP '+res.status+')');
  return [...doc.getElementsByTagName('item')].slice(0,60).map(it=>{
    const o={};[...it.children].forEach(ch=>o[ch.tagName]=ch.textContent.trim());return o;
  });
}

}

/* 캐시된 여러 API 결과를 한 건의 정보로 병합 */

function gdRow(c){
  const s=gdSummary(c);if(!s||(!s.insp&&!s.ins))return '';
  return `<div class="gdrow">🏛️ <b>공단 정보</b>`+
    (s.insp?`<div class="gd-l ${gdCls(s.insp)}">검사 유효기간 만료 ${gdWarn(s.insp)}</div>`:'')+
    (s.ins?`<div class="gd-l ${gdCls(s.ins)}">보험 만료 ${gdWarn(s.ins)}</div>`:'')+`</div>`;
}
/* 업체 탭 상단: 공단 기준 만료 임박/경과 업체 */
function gdBanner(){
  const box=$('#gdBanner');if(!box)return;
  const rows=[];
  companies.forEach(c=>{
    const s=gdSummary(c);if(!s)return;
    [['검사',s.insp],['보험',s.ins]].forEach(([k,d])=>{if(d&&daysUntil(d)<=30)rows.push({c,k,d,n:daysUntil(d)})});
  });
  if(!rows.length){box.innerHTML='';return}
  rows.sort((a,b)=>a.n-b.n);
  box.innerHTML=`<div class="gdbanner"><b>🏛️ 공단 기준 만료 임박·경과 ${rows.length}건</b>`+
    rows.slice(0,8).map(r=>`<button data-gd="${r.c.id}"><span>${esc(r.c.name)} · ${r.k}</span><span>${r.n<0?`🔴 ${-r.n}일 지남`:r.n<=7?`🔴 D-${r.n}`:`⚠️ D-${r.n}`}</span></button>`).join('')+
    (rows.length>8?`<small>외 ${rows.length-8}건</small>`:'')+`</div>`;
  box.querySelectorAll('[data-gd]').forEach(b=>b.onclick=()=>gdModal(b.dataset.gd));
}

/* ===== 조회 모달 ===== */
const GD_SRC_NOTE='출처: 한국승강기안전공단 (공공데이터포털)';
function gdTimeline(m){
  if(!m.hist.length)return '<div class="empty" style="padding:12px">검사 이력이 없습니다</div>';
  return `<div class="tl2">`+m.hist.slice(0,15).map(x=>{
    const bad=x.ok==='N'||/불합격|조건부|부적합/.test(x.res);
    const res=x.ok==='Y'?'합격':x.ok==='N'?'불합격':x.res;
    return `<div class="tl2-i ${bad?'bad':''}"><div class="tl2-d">${gdDK(x.date)}</div><div class="tl2-t">${esc(x.kind||'검사')}${res?` · <b>${esc(res)}</b>`:''}</div>`+
      `<small>${x.to?'유효기간 ~ '+gdDK(x.to):''}${x.org?(x.to?' · ':'')+esc(x.org):''}</small></div>`}).join('')+`</div>`;
}
function gdElevHTML(c,no){
  const e=gdCache[no]||{}, m=gdMerge(no);
  const srcs=Object.keys(GD_SRC), okN=srcs.filter(k=>e[k]&&e[k].ok).length;
  const errs=srcs.filter(k=>e[k]&&!e[k].ok);
  const found=srcs.some(k=>gdItems(no,k).length);
  if(!found){
    return `<div class="gd-el"><div class="gd-h">승강기 ${esc(no)}</div>`+
      (okN?`<div class="gd-note">공단에 등록된 정보를 찾지 못했습니다. 승강기 고유번호를 확인해 주세요.</div>`:
        `<div class="gd-note err">${errs.length?esc(e[errs[0]].msg):'조회 결과가 없습니다.'}</div>`)+
      (errs.length&&okN?gdErrList(e,errs):'')+`</div>`;
  }
  const iw=m.ins?(m.ins.state==='on'?`<span class="tag" style="background:#2e9e5b">가입 중</span> ${gdDK(m.ins.from)} ~ ${gdDK(m.ins.to)}${m.ins.co?' <small>'+esc(m.ins.co)+'</small>':''}`
    :m.ins.state==='off'?`<span class="tag" style="background:#d93636">만료</span> ${gdDK(m.ins.to)} 종료${m.ins.co?' <small>'+esc(m.ins.co)+'</small>':''}`
    :'<span class="tag" style="background:#7b8494">신고 내역 없음</span>'):(e.ins&&!e.ins.ok?'<small>조회 불가</small>':'-');
  const apply=[];
  if(m.validEnd&&m.validEnd!==c.inspectionDate)apply.push(`<button class="btn ghost" data-apply="insp" data-no="${esc(no)}">정기 검사일을 ${esc(m.validEnd)}로 적용</button>`);
  if(m.ins&&m.ins.to&&m.ins.to!==c.insuranceDate)apply.push(`<button class="btn ghost" data-apply="ins" data-no="${esc(no)}">보험 만기일을 ${esc(m.ins.to)}로 적용</button>`);
  return `<div class="gd-el"><div class="gd-h">승강기 ${esc(no)}${m.name?' · '+esc(m.name):''}</div>
    ${m.kind||m.place||m.status?`<div class="gd-sub">${[m.kind,m.place,m.status].filter(Boolean).map(esc).join(' · ')}</div>`:''}
    <div class="detail-row"><span>설치일자</span><span>${gdDK(m.install)}${m.first&&m.first!==m.install?` <small>(최초 ${gdDK(m.first)})</small>`:''}</span></div>
    <div class="detail-row"><span>검사 유효기간</span><span>${m.validEnd?`${m.validFrom?gdDK(m.validFrom)+' ~ ':'~ '}${gdWarn(m.validEnd)}`:'-'}${m.lastResult?`<br><small>최근 결과: ${esc(m.lastResult)}</small>`:''}</span></div>
    <div class="detail-row"><span>보험 상태</span><span>${iw}</span></div>
    ${m.mnt?`<div class="detail-row"><span>유지관리</span><span>${esc(m.mnt)}${m.mntTel?` <a href="tel:${esc(m.mntTel)}">📞 ${esc(m.mntTel)}</a>`:''}</span></div>`:''}
    <div class="sec-title" style="margin:12px 2px 6px">📊 공단 등록 정보 · 검사이력</div>
    ${gdTimeline(m)}
    ${apply.length?`<div class="m-acts" style="flex-direction:column;margin-top:8px">${apply.join('')}</div>`:''}
    ${errs.length?gdErrList(e,errs):''}</div>`;
}
function gdErrList(e,errs){
  const by={};errs.forEach(k=>(by[e[k].msg]=by[e[k].msg]||[]).push(GD_SRC[k].n));
  return `<details class="gd-errs"><summary>⚠️ 일부 항목 조회 불가 (${errs.length}/${Object.keys(GD_SRC).length})</summary>`+
    Object.entries(by).map(([msg,ns])=>`<div><b>${ns.map(esc).join(', ')}</b><br>${esc(msg)}</div>`).join('')+`</details>`;
}
function gdModal(id,force){
  const c=companies.find(x=>x.id===id);if(!c)return;
  const nos=elNos(c);
  if(!nos.length){toast('승강기 고유번호를 먼저 입력해 주세요');coForm(id);return}
  const m=openModal(`<h2>🔍 공단 정보 · ${esc(c.name)}</h2><div id="gdBody"></div>
    <div class="gd-src">${GD_SRC_NOTE}</div>
    <div class="m-acts"><button class="btn ghost" id="gdClose">닫기</button><button class="btn gold" id="gdRe">🔄 새로 조회</button></div>`);
  m.querySelector('#gdClose').onclick=closeModal;
  const body=m.querySelector('#gdBody'), reBtn=m.querySelector('#gdRe');
  const paint=()=>{
    body.innerHTML=nos.map(n=>gdElevHTML(c,n)).join('');
    body.querySelectorAll('[data-apply]').forEach(b=>b.onclick=()=>{
      const mm=gdMerge(b.dataset.no);
      if(b.dataset.apply==='insp')c.inspectionDate=mm.validEnd;else c.insuranceDate=mm.ins.to;
      const n=syncAutoSchedules(c);persist();render();paint();
      toast(n?`✅ 적용됨 · 자동 일정 ${n}건 생성`:'✅ 적용되었습니다');
    });
  };
  const run=async f=>{
    if(gdBusy){toast('다른 조회가 진행 중입니다');return}
    gdBusy=true;reBtn.disabled=true;
    let done=0;
    body.innerHTML=`<div class="gd-load"><div class="spin"></div><div>공단 서버에서 조회 중… <span id="gdProg">0/${nos.length}</span></div></div>`;
    try{
      for(const n of nos){
        await Promise.all(Object.keys(GD_SRC).map(k=>gdFetchSrc(k,n,f)));
        done++;const p=body.querySelector('#gdProg');if(p)p.textContent=done+'/'+nos.length;
      }
    }catch(e){}
    gdBusy=false;reBtn.disabled=false;
    if(!document.body.contains(body))return;
    paint();gdRerender();
  };
  reBtn.onclick=()=>run(true);
  run(!!force);
}

/* ===== 만료 자동 확인 / 수동 동기화 ===== */
async function gdRefreshAll(force,onProg){
  const list=companies.filter(c=>elNos(c).length);
  const nos=[...new Set(list.flatMap(elNos))];
  const kinds={};let i=0;
  for(const n of nos){
    const rs=await Promise.all(['exp','buld','ins'].map(k=>gdFetchSrc(k,n,force)));
    rs.forEach(r=>{if(!r.ok)kinds[r.kind]=(kinds[r.kind]||0)+1});
    i++;if(onProg)onProg(i,nos.length);
  }
  try{localStorage.setItem(KEY_GDSYNC,String(Date.now()))}catch(e){}
  return {total:nos.length,kinds};
}
const gdKindMsg={key:'인증키/사용 승인 문제로 일부 API를 조회하지 못했습니다',quota:'API 호출 한도를 초과했습니다',net:'네트워크 오류로 일부 조회에 실패했습니다',api:'공단 서버 오류로 일부 조회에 실패했습니다'};
function gdWarnList(){
  const out=[];
  companies.forEach(c=>{const s=gdSummary(c);if(!s)return;
    [['검사',s.insp],['보험',s.ins]].forEach(([k,d])=>{if(d&&daysUntil(d)<=30)out.push({c,k,d,n:daysUntil(d)})})});
  return out.sort((a,b)=>a.n-b.n);
}
function settingsModal(){
  const nCo=companies.filter(c=>elNos(c).length).length, nNo=new Set(companies.flatMap(elNos)).size;
  const last=+localStorage.getItem(KEY_GDSYNC)||0;
  const m=openModal(`<h2>⚙️ 설정</h2>
    <div class="sec-title" style="margin-top:0">🏛️ 공단 데이터</div>
    <div class="detail-row"><span>등록 현황</span><span>승강기번호가 등록된 업체 ${nCo}곳 · 승강기 ${nNo}대</span></div>
    <div class="detail-row"><span>마지막 동기화</span><span id="gdLast">${last?new Date(last).toLocaleString('ko-KR'):'없음'}</span></div>
    <div id="gdSetOut" style="margin-top:10px"></div>
    <div class="m-acts" style="flex-direction:column;margin-top:10px">
      <button class="btn gold" id="gdSync">🔄 공단 데이터 새로고침</button>
      <button class="btn ghost" id="gdClear">🗑️ 공단 조회 캐시 삭제</button>
    </div>
    <div class="gd-src">검사만료·보험 정보를 공단에서 다시 받아 업체 경고에 반영합니다. 조회 결과는 24시간 동안 기기에 저장됩니다.<br>${GD_SRC_NOTE}</div>
    <div class="m-acts"><button class="btn ghost" id="setClose">닫기</button></div>`);
  m.querySelector('#setClose').onclick=closeModal;
  const out=m.querySelector('#gdSetOut'), btn=m.querySelector('#gdSync');
  const showWarn=()=>{
    const w=gdWarnList();
    return w.length?`<div class="gdbanner"><b>만료 임박·경과 ${w.length}건</b>`+w.slice(0,10).map(r=>`<div class="gd-l"><span>${esc(r.c.name)} · ${r.k}</span><span>${r.n<0?`🔴 ${-r.n}일 지남`:r.n<=7?`🔴 D-${r.n}`:`⚠️ D-${r.n}`}</span></div>`).join('')+`</div>`:'<div class="gd-note">30일 이내 만료 예정인 항목이 없습니다 ✅</div>'};
  if(nNo)out.innerHTML=showWarn();
  m.querySelector('#gdClear').onclick=()=>{
    if(!confirm('저장된 공단 조회 결과를 모두 삭제할까요?'))return;
    gdCache={};gdSave();try{localStorage.removeItem(KEY_GDSYNC)}catch(e){}
    out.innerHTML='';m.querySelector('#gdLast').textContent='없음';gdRerender();toast('🗑️ 캐시를 삭제했습니다');
  };
  btn.onclick=async()=>{
    if(gdBusy){toast('다른 조회가 진행 중입니다');return}
    if(!nNo){out.innerHTML='<div class="gd-note">먼저 업체 정보에 승강기 고유번호를 입력해 주세요.</div>';return}
    gdBusy=true;btn.disabled=true;
    out.innerHTML=`<div class="gd-load"><div class="spin"></div><div>동기화 중… <span id="gdP">0/${nNo}</span></div></div>`;
    let r;
    try{r=await gdRefreshAll(true,(i,t)=>{const p=out.querySelector('#gdP');if(p)p.textContent=i+'/'+t})}
    catch(e){r={total:0,kinds:{api:1}}}
    gdBusy=false;btn.disabled=false;
    if(!document.body.contains(out))return;
    const ks=Object.keys(r.kinds);
    out.innerHTML=(ks.length?`<div class="gd-note err">${ks.map(k=>esc(gdKindMsg[k]||'일부 조회에 실패했습니다')).join('<br>')}<br><small>기존 앱 기능에는 영향이 없습니다.</small></div>`:'')+showWarn();
    m.querySelector('#gdLast').textContent=new Date().toLocaleString('ko-KR');
    gdRerender();
  };
}
$('#settingsBtn').onclick=settingsModal;
/* 앱 시작 시 캐시가 오래된 승강기만 조용히 확인 (오류는 무시) */
setTimeout(()=>{if(!gdBusy&&companies.some(c=>elNos(c).length)){gdBusy=true;gdRefreshAll(false).catch(()=>{}).then(()=>{gdBusy=false;gdRerender()})}},3000);

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
render();
/* 첫 로드 후 백그라운드에서 좌표 변환 시작 */
setTimeout(()=>loadKakao(ok=>{if(ok)startGeocoding();else if(tab==='map')mapFail()}),1500);
</script>
